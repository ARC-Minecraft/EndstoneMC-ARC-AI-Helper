[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone_arc_ai_helper"
version = "1.2.1"
dependencies = ["requests>=2.25.0", "websockets>=12.0"]
authors = [
    { name = "DEVILENMO", email = "DEVILENMO@gmail.com" },
]
description = "AI Helper plugin for Endstone - chat-based assistant that talks with players."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin", "ai", "assistant", "chat", "openai"]

[project.urls]
Homepage = "https://github.com/EndstoneMC/python-example-plugin"

[project.entry-points."endstone"]
arc_ai_helper = "endstone_arc_ai_helper.ai_helper_plugin:ARCAIHelperPlugin"